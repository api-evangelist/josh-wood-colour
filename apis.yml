name: Josh Wood Colour
description: 'Josh Wood Colour is a UK-based at-home hair colour brand founded by celebrity
  colourist Josh Wood, selling permanent and semi-permanent hair dye, root touch-up,
  gloss, toners, blonde and grey-blending products, and haircare direct to consumers
  through a Shopify-powered online store at joshwoodcolour.com. The brand pairs its
  retail catalogue with a free personalised colour-matching consultation service and
  editorial hair-care advice. It was surfaced as a portfolio company of Index Ventures
  and added to the API Evangelist network. As a consumer retail e-commerce brand it
  exposes no public developer API, OpenAPI, or documentation surface; this profile
  captures its web identity, security posture, and customer-facing properties.'
